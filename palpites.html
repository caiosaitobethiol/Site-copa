    <link rel="icon" type="image/x-icon" href="img/images-removebg-preview.png">

</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="img/176026_imgbank_.png" alt="Logo Oficial da Copa do Mundo 2026">

            <a href="palpites.html">Palpites</a>
        </nav>
    </header>

    <main class="container">
        <h1>Palpitômetro</h1>
        <p>Preencha o formulário abaixo para enviar seus palpites para essa Copa do Mundo</p>

        <form action="#" method="POST">

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">Contato</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email (exemplo@gmail.com)" required>
            </div>

            <div class="form-group">
                <label for="nome">Campeão:</label>
                <input type="text" id="text" name="text" placeholder="Quem será o campeão?" required>
            </div>

            <div class="form-group">
                <label for="text">Vice-Campeão:</label>
                <input type="text" id="text" name="text" placeholder="Quem será o vice-campeão?" required>
            </div>

            <div class="form-group">
                <label for="email">Artilheiro:</label>
                <input type="text" id="text" name="text" placeholder="Quem será o artilheiro?" required>
            </div>

            <div class="form-group">
                <label for="assunto">Até onde o Brasil chega?</label>
                <select id="assunto" name="assunto">
                    <option value="bilhetes">Fase de grupos</option>
                    <option value="noticias">16 avos de final</option>
                    <option value="sugestoes">Oitavas de final</option>
                    <option value="outros">Quartas de final</option>
                    <option value="noticias">Semifinais</option>
                    <option value="sugestoes">Final</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Algum palpite polêmico?</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Seleção X será a decepção da Copa, Seleção Y será uma surpresa, etc..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Enviar Palpite</button>
                <button type="reset" class="btn-reset">Limpar Campos</button>
            </div>
        </form>
    </main>
