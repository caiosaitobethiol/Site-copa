<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | FIFA World Cup 2026™</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>
    <header>
        <div class="logo">Copa 2026™ Blog</div>
        <nav aria-label="Navegação Principal">
            <a href="index.html">Início</a>
            <a href="calendario.html">Calendário</a>
            <a href="multimidia.html">Multimídia</a>
            <a href="curiosidades.html">Curiosidades</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main class="container">
        <h1>Fale Connosco</h1>
        <p>Preencha o formulário abaixo para enviar dúvidas ou sugestões para o blog.</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Escreva o seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">Endereço de E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="assunto">Assunto Principal:</label>
                <select id="assunto" name="assunto">
                    <option value="bilhetes">Informações sobre Bilhetes</option>
                    <option value="noticias">Envio de Notícias</option>
                    <option value="sugestoes">Sugestões para o Blog</option>
                    <option value="outros">Outros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Deixe aqui a sua mensagem..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Enviar Mensagem</button>
                <button type="reset" class="btn-reset">Limpar Campos</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Blog Académico HTML/CSS.</p>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>

</html>
